permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - 'main'
jobs:
  page_deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: upload
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./index.html
      - name: page_deploy
        uses: actions/deploy-pages@v4